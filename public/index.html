<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhya's Hat Tracker</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f4ef">
<style>
/* Tokens. Text colours (--mute, --accent, --ok, --warn) and the white-text fills (--*-fill) are separate so both themes keep 4.5:1 contrast;
   --edge is the 3:1 border for controls, --line the quiet divider. Everything below uses these, no raw colours. */
:root{--on-fill:#fff;--bg:#f6f4ef;--card:#fff;--chip:#ebe6da;--ink:#1f2328;--mute:#565d6b;--line:#e3dfd6;--edge:#86806f;
  --accent:#a63f25;--accent-fill:#a63f25;--ok:#1f6b3e;--ok-fill:#1f6b3e;--warn:#7a4e00;--warn-fill:#7a4e00;--info-fill:#2a6496;--mute-fill:#565d6b;
  --ease:cubic-bezier(.2,.7,.2,1);--t:.18s;--text-s:14px;--text-m:16px;--h1:20px;--h2:24px;--lh:1.45;--lh-t:1.25;--lh-l:1.8;--r:6px;--r-m:10px;--r-l:14px;--pill:999px;--shadow:0 6px 24px rgba(0,0,0,.3);--shadow-sm:0 3px 12px rgba(0,0,0,.22);--shadow-side:-8px 0 24px rgba(0,0,0,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16181c;--card:#20242a;--chip:#2c323b;--ink:#e8e6e1;--mute:#a3abb6;--line:#31363e;--edge:#7b8594;
  --accent:#ec8a6c;--accent-fill:#b4472b;--ok:#6fcf97;--ok-fill:#2a7d4f;--warn:#e6b04f;--warn-fill:#8a5a00;--info-fill:#2f72ab;--mute-fill:#5a6270}}
:root[data-theme=dark]{--bg:#16181c;--card:#20242a;--chip:#2c323b;--ink:#e8e6e1;--mute:#a3abb6;--line:#31363e;--edge:#7b8594;
  --accent:#ec8a6c;--accent-fill:#b4472b;--ok:#6fcf97;--ok-fill:#2a7d4f;--warn:#e6b04f;--warn-fill:#8a5a00;--info-fill:#2f72ab;--mute-fill:#5a6270}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* motion: short, eased, and off for people who ask for less */
a,button,input,select,.ms summary,.chip,.card,.round{transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease),box-shadow var(--t) var(--ease),transform var(--t) var(--ease),opacity var(--t) var(--ease)}
.meter i{transition:width .35s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes push{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}  /* transform and opacity only: animating width would re-lay-out every card each frame */
@keyframes sheet{from{transform:translateY(100%);opacity:.6}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--text-m)/var(--lh) system-ui,-apple-system,Segoe UI,sans-serif}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{image-rendering:pixelated}
::placeholder{color:var(--mute);opacity:1}
/* type scale. Body: 14 and 16. Headings: h1 20, h2 24, h3 14 (small caps-style label), h4 16. Weights: 400 and 600. Line heights: 1.25 (names and headings), 1.45 (text), 1.8 (long inline lists). */
h1,h2,h3,h4{margin:0;font-weight:600;line-height:var(--lh-t)}
h1{font-size:var(--h1);margin-right:12px}h2{font-size:var(--h2)}h4{font-size:var(--text-m)}
h3{margin:14px 0 4px;font-size:var(--text-s);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
b,th,.nm,.ttl,.hatlink,.utotal,.fold summary,.pct{font-weight:600}
a{color:var(--accent)}
/* shared pieces */
.dr,.drops-list{line-height:var(--lh-l)}
.muted,.sub,.desc,.dr,.stats,.empty,.ttl,.urow .q,.used a,th{color:var(--mute);font-size:var(--text-s)}
.ctl,input,select,button,.ms summary{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--edge);border-radius:var(--r-m);padding:6px 10px}
button,.ms summary{cursor:pointer}
.ctl:hover,button:hover,.ms summary:hover,.on,.act,.sel{border-color:var(--accent)}
button.on{background:var(--accent-fill);color:var(--on-fill)}
.box{border:1px solid var(--line);border-radius:var(--r-l);background:var(--bg);padding:10px 12px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.lrow:first-child{border-top:0}
.lrow .n{flex:1;min-width:0}
.off{color:var(--mute)}.off img{opacity:.5}
.meter{height:6px;background:var(--chip);border-radius:var(--r);overflow:hidden;margin:6px 0 10px}.meter i{display:block;height:100%;width:0;background:var(--ok-fill);transition:width .2s}.meter.lg{height:14px;border-radius:var(--pill);margin:10px 0 0}.meter.lg i{border-radius:var(--pill)}
.progress{margin-bottom:12px}.progress-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.pct{font-size:var(--h2);line-height:1;font-variant-numeric:tabular-nums}
.meter.warn i{background:var(--warn-fill)}
/* chip: every label, tag, status and copy button */
.chip{display:inline-block;font:inherit;font-size:var(--text-s);padding:1px 10px;border-radius:var(--pill);background:var(--chip);color:var(--mute);border:1px solid transparent;white-space:nowrap;text-decoration:none}
.chip.ok{background:var(--ok-fill);color:var(--on-fill)}.chip.warn{background:var(--warn-fill);color:var(--on-fill)}.chip.accent{background:var(--accent-fill);color:var(--on-fill)}.chip.cool{background:var(--info-fill);color:var(--on-fill)}
.chip.outline{background:transparent;color:var(--ink);border-color:var(--warn)}
.chip.link{color:var(--ink);border-color:var(--edge);padding:4px 12px}.chip.link:hover{color:var(--accent);border-color:var(--accent)}
.chip.copy{font-family:ui-monospace,Menlo,monospace;padding:0 6px;border-radius:var(--r);border-color:var(--line);cursor:pointer}.chip.copy:hover{color:var(--ink);border-color:var(--accent)}.chip.copy.ok{border-color:var(--ok-fill)}
/* layout */
header,.pbar{transition:box-shadow var(--t) var(--ease)}
header.stuck,aside.stuck .pbar{box-shadow:var(--shadow-sm)}  /* shown once the content has scrolled under them */
header:has(.ms[open]){z-index:30}  /* an open header menu sits above everything, including the mobile sheet */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions{display:contents}.lbl{display:none}
.more{margin-left:auto}
.more .opts .ms{display:block}.more .opts .ms summary{border-color:transparent;width:100%}.more .opts .ms .opts{position:static;margin:2px 0 6px 12px;box-shadow:none;border:0;padding:0;min-width:0;max-height:none;animation:none}.more .opts .lbl{display:inline}
.search{position:relative;flex:1;min-width:min(300px,100%)}.search input{width:100%;padding-right:40px}
.mag{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
header .meter.lg{margin:16px 0 6px}
.stats{margin-top:6px}
.layout{display:flex;align-items:flex-start}
main{padding:16px;flex:1;min-width:0}
aside{z-index:4;box-shadow:var(--shadow-side);position:sticky;top:var(--hh,100px);width:max(600px,40vw);flex:none;height:calc(100vh - var(--hh,100px));overflow:auto;background:var(--card);border-left:1px solid var(--line)}
aside[hidden]{display:none}
aside:not([hidden]){animation:push .26s var(--ease)}aside.out{animation:push .2s var(--ease) reverse forwards}
.dlg.swap{animation:rise .24s var(--ease)}
.row.stacked h1{width:100%;margin:0}
@media (max-width:520px){.hero{flex-direction:column}.hero .art{width:100%}h1,.search{width:100%;flex-basis:100%}}
@media (max-width:1000px){aside:not([hidden]){animation:sheet .3s var(--ease)}aside.out{animation:sheet .2s var(--ease) reverse forwards}aside{position:fixed;inset:0;top:auto;height:80vh;width:100%;border:1px solid var(--line);border-radius:var(--r-l) var(--r-l) 0 0;z-index:10;box-shadow:var(--shadow)}}
.ms{position:relative}.ms summary{list-style:none;user-select:none}.ms summary::-webkit-details-marker{display:none}.ms summary::after{content:"▾";display:inline-block;margin-left:6px;color:var(--mute);transition:transform var(--t) var(--ease)}.ms[open] summary::after{transform:rotate(180deg)}
.ms[open] .opts{animation:pop .16s var(--ease)}.ms .opts,.pop{position:absolute;z-index:30;top:100%;left:0;margin-top:4px;background:var(--card);border:1px solid var(--edge);border-radius:var(--r-m);padding:6px;min-width:180px;max-height:300px;overflow:auto;box-shadow:var(--shadow)}
.ms.right .opts{left:auto;right:0}.ms.more .opts{max-height:min(70vh,520px)}
/* every menu row (checkbox, action or choice) looks the same */
.ms .opts label,.ms .opts button,.pop>button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border:0;border-radius:var(--r);background:transparent;color:var(--ink);text-align:left;white-space:nowrap;cursor:pointer}
.ms .opts label:hover,.ms .opts button:hover,.pop>button:hover{background:var(--chip)}.ms .opts>*+*,.pop>*+*{margin-top:2px}.pop{position:fixed;margin:0}.pop:not([hidden]){animation:pop .16s var(--ease)}
.ms .opts [aria-checked=true]::after{content:"✓";margin-left:auto;padding-left:16px}
.quick:not([hidden]){animation:rise .2s var(--ease)}.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.qrow{display:flex;align-items:center;gap:8px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.card:hover,.card.sel{border-color:var(--accent)}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card:active{transform:none}.card.sel{box-shadow:0 0 0 1px var(--accent)}
.card.s-crafted,.card.s-owned{border-color:var(--ok-fill)}
.art{display:flex;align-items:center;justify-content:center;padding:16px;background:var(--chip);border-radius:var(--r-m)}
.card .art{height:132px}.art img{max-width:100%;object-fit:contain}.art img.fb{width:100%;height:100%;object-fit:contain}
.card .nm{line-height:var(--lh-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .nm img{width:24px;height:24px;vertical-align:middle}
.card>.chip{position:absolute;top:8px;right:8px}
/* panel */
.dlg{padding:0 20px 28px}
.pbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;min-height:52px;margin:0 -20px 12px;padding:8px 12px 8px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar a{font-size:var(--text-s)}
.round{width:34px;height:34px;padding:0;border-radius:50%;display:inline-grid;place-items:center;flex:none;line-height:1}
.round.ghost{color:var(--mute);background:transparent;border-color:transparent}.round.ghost:hover{background:var(--chip);color:var(--ink);border-color:var(--edge)}
.round.count{font-size:var(--text-s);font-weight:600}
.xbtn{font-size:var(--h2)}.pop-edit{display:flex;flex-direction:column;gap:6px;padding:2px}.pop-edit .stepper input{flex:1;width:auto;min-width:0}.pop.edit{width:144px;min-width:0;padding:4px}.pop-edit .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pop-edit .stepper .step{padding:6px 7px}.pop-edit .stepper input{padding:6px 2px}
.hero{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.hero .art{min-width:144px;min-height:144px;flex:none;border:1px solid var(--line);border-radius:var(--r-l)}
.hero .info{flex:1;min-width:0}
.kicker{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:8px 14px;align-items:center;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.facts dt{color:var(--mute);font-size:var(--text-s)}.facts dd{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.stepper{display:inline-flex;flex:none;border:1px solid var(--edge);border-radius:var(--r-m);overflow:hidden;background:var(--card)}
.stepper input{width:calc(5ch + 32px);padding-inline:6px;border:0;border-radius:0;text-align:center;font-weight:400;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper .step{border:0;border-radius:0;padding:6px 12px;line-height:1.25;color:var(--mute);background:var(--chip)}
.stepper .step:hover{color:var(--ink);background:var(--line)}.stepper .step:active{transform:scale(.94)}
.stepper:focus-within{border-color:var(--accent)}
.ms-status{--fill:var(--accent-fill)}.ms-status[data-st=none]{--fill:var(--mute-fill)}.ms-status[data-st=collecting]{--fill:var(--warn-fill)}.ms-status[data-st=crafted],.ms-status[data-st=owned]{--fill:var(--ok-fill)}
.ms-status summary{background:var(--fill);color:var(--on-fill);border-color:transparent;font-weight:600}.ms-status summary::after{color:inherit}.ms-status summary:hover{border-color:var(--on-fill)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 8px}
.sec h3{margin:0;}.sec .sub{font-variant-numeric:tabular-nums}
.uses{padding-block:4px}.urow .q{font-variant-numeric:tabular-nums}
.prow{margin-bottom:8px}.prow .top{display:flex;align-items:center;gap:12px}.prow .top>img{width:32px;height:32px;flex:none}
.prow .nm2{flex:1;min-width:0;line-height:var(--lh-t)}
.prow .dr{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.fold summary{cursor:pointer}.fold .prow{margin:0;padding:10px 0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}.fold summary+.prow{margin-top:8px}.fold .desc{margin:8px 0 0}.desc{white-space:pre-line}
.hatlink{text-decoration:none}.hatlink:hover{text-decoration:underline}
.about p{margin:0 0 6px}.about h3{margin-top:18px}.about code{background:var(--chip);padding:1px 5px;border-radius:var(--r)}
/* materials table */
#mats table{width:100%;border-collapse:collapse}
#mats .mname{white-space:nowrap}.mn{display:flex;align-items:center;gap:8px;min-width:0}
#mats{overflow-x:auto}#mats td.used{width:100%;max-width:0;min-width:220px}.used-cell{display:flex;align-items:center;gap:8px;min-width:0}
.used-list{display:flex;min-width:0;overflow:hidden;white-space:nowrap}.used-list a{flex:none}.used-list a.trunc{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}.used-list a:not(.lastv)::after{content:",";margin-right:.35em}.more-hats{flex:none;padding:0;border:0;background:none;color:var(--mute);font-size:var(--text-s);white-space:nowrap}.more-hats:hover{color:var(--accent);text-decoration:underline}
.mctl{display:none}.mcount{font-variant-numeric:tabular-nums;color:var(--mute);margin-right:4px}.mcount b{color:var(--ink)}.mtext{white-space:nowrap}
#mats th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
#mats td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
#mats .num{text-align:right;font-variant-numeric:tabular-nums}
#mats img{width:24px;height:24px;flex:none}
.used a{text-decoration:none}.used a:hover{color:var(--accent);text-decoration:underline}
.empty{text-align:center;padding:40px}
@media (max-width:700px){
  #mats table,#mats tbody{display:block}#mats thead{display:none}
  #mats tr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  #mats td{display:none;border:0;padding:0}#mats td.mctl{display:flex;align-items:center;min-width:0}#mats td.mname{display:block;min-width:0}
  #mats .mname .mtext{overflow:hidden;text-overflow:ellipsis;min-width:0}#mats .mname .chip{flex:none}
  #mats .mctl{gap:2px}
}
@media (max-width:399px){  /* too narrow for name and id side by side: id goes under the name */
  #mats .mn{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;row-gap:4px}
  #mats .mn img{grid-row:1/3;grid-column:1}#mats .mn .mtext{grid-column:2}#mats .mn .chip{grid-column:2;justify-self:start}
}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Rhya's Hat Tracker</h1>
    <div class="search"><input id="q" type="search" placeholder="Search hats, materials, NPC…" aria-label="Search hats, materials, NPC"><svg class="mag" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
    <details class="ms" id="fs"><summary>Status</summary><div class="opts"></div></details>
    <details class="ms" id="fn"><summary>Source</summary><div class="opts"></div></details>
    <div class="actions" id="actions">
      <button id="rdy" title="Only hats whose materials are all collected">Ready to craft</button>
      <button id="view" title="Switch between the hat list and the combined material list">Materials list</button>
      <button id="about">About</button>
      <button id="exp">Export</button><button id="imp">Import</button>
      <button id="th" title="Toggle theme"><span aria-hidden="true">◐</span><span class="lbl"> Theme</span></button>
    </div>
    <details class="ms right more" id="more" hidden><summary aria-label="More actions">More</summary><div class="opts"></div></details>
  </div>
  <div class="meter lg"><i id="prog"></i></div>
  <div class="stats"><span id="stats"></span> · <span id="sv"></span></div>
</header>
<div class="layout"><main><div class="quick" id="quick" hidden></div><div class="grid" id="grid"></div><div id="mats" hidden></div><div class="empty" id="empty" hidden>No hats match.</div>
<p class="sub" id="note"></p></main>
<aside id="panel" hidden><div class="dlg" id="dbody"></div></aside></div>
<div class="pop" id="pop" role="menu" hidden></div>
<input type="file" id="file" accept="application/json" hidden>
<script>
const STATUS={none:'Not started',collecting:'Collecting',crafted:'Crafted',owned:'Owned'};
const DONE=s=>s==='crafted'||s==='owned';
let HATS=[],state={};
const KEY='hat-tracker-v1';
const load=()=>{try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}migrate()};
function migrate(){if(state._inv)return;state._inv={};for(const o of Object.values(state))for(const[k,v]of Object.entries(o.have||{}))state._inv[k]=Math.max(state._inv[k]||0,v)}
let serverOK=false,pushT=null;
const note=t=>{const e=document.getElementById('sv');if(e)e.textContent=t};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}
  if(!serverOK)return;note('Saving…');clearTimeout(pushT);pushT=setTimeout(pushServer,300)};
const clock=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',timeZoneName:'short'});  // local time, local format and zone
const savedAt=d=>'Saved to progress.json'+(d&&!isNaN(d)?' at '+clock(d):'');
async function pushServer(){try{const r=await fetch('api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});if(!r.ok)throw 0;note(savedAt(new Date()));return true}catch{note('Could not save to progress.json');return false}}
// save right now (skipping the 300 ms delay) and wait for it; false if the repo copy could not be written
async function saveNow(){
  clearTimeout(pushT);try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}
  if(!serverOK)return true;note('Saving…');return pushServer();
}
// progress.json in the repo (served by scripts/serve.py) wins over the browser copy; without the server the browser copy is used
async function loadServer(){try{const r=await fetch('api/progress',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();serverOK=true;
  if(Object.keys(j).length){state=j;migrate();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}note(savedAt(new Date(r.headers.get('Last-Modified'))))}
  else if(Object.keys(state).length)pushServer();else note('Saves to progress.json')}catch{serverOK=false;note('Saved in this browser only (run scripts/serve.py to save to the repo)')}}
const st=h=>state[h.id]||(state[h.id]={status:'none',have:{}});
const status=h=>{const s=(state[h.id]||{}).status||'none';
  if(!h.ingredients.length)return s==='crafted'?'owned':s==='collecting'?'none':s;  // nothing to craft or collect: only Not started or Owned
  return s==='none'&&h.ingredients.some(g=>have(h,g)>0)?'collecting':s};  // holding any material counts as in progress
// amounts are whole numbers from 0 to MAX_HAVE; anything bigger is a typo, so the box goes back to what it was
const MAX_HAVE=15000;
function setHave(id,raw,input){
  const inv=state._inv||(state._inv={}),prev=inv[id]||0,n=Math.floor(Math.max(0,+raw||0));
  if(n>MAX_HAVE){if(input)input.value=prev||'';return false}
  inv[id]=n;return true;

const have=(h,g)=>(state._inv||{})[g.id]||0;  // one shared count per material, not per hat

  document.addEventListener('click',async e=>{const b=e.target.closest('.copy');if(!b)return;e.preventDefault();e.stopPropagation();
    const v=b.dataset.copy;try{await navigator.clipboard.writeText(v)}catch{const t=document.createElement('textarea');t.value=v;document.body.append(t);t.select();try{document.execCommand('copy')}catch{}t.remove()}
    const o=b.textContent;b.textContent='copied';b.classList.add('ok');setTimeout(()=>{b.textContent=o;b.classList.remove('ok')},900)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('pop').hidden)return closePop();if(!$('panel').hidden&&!e.target.closest?.('.ms'))closePanel()}});
  $('view').onclick=()=>{view=view==='mats'?'grid':'mats';render()};
  $('rdy').onclick=()=>{onlyReady=!onlyReady;render()};
  document.addEventListener('click',e=>{document.querySelectorAll('.ms[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});
  $('grid').onclick=e=>{const c=e.target.closest('.card');if(c){navStack=[];openHat(c.dataset.id)}};
  $('about').onclick=about;
  document.addEventListener('click',e=>{if(!e.target.closest('#pop'))closePop()});addEventListener('scroll',closePop,{passive:true,capture:true});addEventListener('resize',closePop);
  new ResizeObserver(()=>fitUsed()).observe($('mats'));
  addEventListener('scroll',edges,{passive:true});$('panel').addEventListener('scroll',edges,{passive:true});edges();
  fitHeader();let lastW=0;new ResizeObserver(([e])=>{const w=Math.round(e.contentRect.width);if(w!==lastW){lastW=w;fitHeader()}}).observe(document.querySelector('header'));
  document.addEventListener('click',e=>{if(e.target.closest('#more .opts button'))$('more').open=false});
  document.addEventListener('click',e=>{const b=e.target.closest('.step');if(!b)return;const i=b.parentElement.querySelector('input');i.value=Math.max(0,(+i.value||0)+ +b.dataset.d)||'';i.dispatchEvent(new Event('change'))});
  $('th').onclick=()=>{const r=document.documentElement,n=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('hat-theme',n)}catch{}};
  $('exp').onclick=async()=>{await saveNow();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));a.download='hat-tracker-progress.json';a.click()};
  $('imp').onclick=()=>$('file').click();
  $('file').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(typeof j!=='object'||Array.isArray(j))throw 0;state=j;migrate();save();render()}catch{alert('Not a valid progress file.')}e.target.value=''};
  render();
}
init();
</script>
</body>
</html>
