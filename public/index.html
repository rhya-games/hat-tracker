<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hat Tracker</title>
<style>
/* Tokens. Text colours (--mute, --accent, --ok, --warn) and the white-text fills (--*-fill) are separate so both themes keep 4.5:1 contrast;
   --edge is the 3:1 border for controls, --line the quiet divider. Everything below uses these, no raw colours. */
:root{--on-fill:#fff;--bg:#f6f4ef;--card:#fff;--chip:#ebe6da;--ink:#1f2328;--mute:#565d6b;--line:#e3dfd6;--edge:#86806f;
  --accent:#a63f25;--accent-fill:#a63f25;--ok:#1f6b3e;--ok-fill:#1f6b3e;--warn:#7a4e00;--warn-fill:#7a4e00;--info-fill:#2a6496;--mute-fill:#565d6b;
  --ease:cubic-bezier(.2,.7,.2,1);--t:.18s;--text-s:14px;--text-m:16px;--h1:20px;--h2:24px;--lh:1.45;--lh-t:1.25;--lh-l:1.8;--r:6px;--r-m:10px;--r-l:14px;--pill:999px;--shadow:0 6px 24px rgba(0,0,0,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16181c;--card:#20242a;--chip:#2c323b;--ink:#e8e6e1;--mute:#a3abb6;--line:#31363e;--edge:#7b8594;
  --accent:#ec8a6c;--accent-fill:#b4472b;--ok:#6fcf97;--ok-fill:#2a7d4f;--warn:#e6b04f;--warn-fill:#8a5a00;--info-fill:#2f72ab;--mute-fill:#5a6270}}
:root[data-theme=dark]{--bg:#16181c;--card:#20242a;--chip:#2c323b;--ink:#e8e6e1;--mute:#a3abb6;--line:#31363e;--edge:#7b8594;
  --accent:#ec8a6c;--accent-fill:#b4472b;--ok:#6fcf97;--ok-fill:#2a7d4f;--warn:#e6b04f;--warn-fill:#8a5a00;--info-fill:#2f72ab;--mute-fill:#5a6270}
*{box-sizing:border-box}
/* motion: short, eased, and off for people who ask for less */
a,button,input,select,.ms summary,.chip,.card,.seg button,.xbtn{transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease),box-shadow var(--t) var(--ease),transform var(--t) var(--ease),opacity var(--t) var(--ease)}
.meter i{transition:width .35s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes push{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}  /* transform and opacity only: animating width would re-lay-out every card each frame */
@keyframes sheet{from{transform:translateY(100%);opacity:.6}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--text-m)/var(--lh) system-ui,-apple-system,Segoe UI,sans-serif}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{image-rendering:pixelated}
::placeholder{color:var(--mute);opacity:1}
/* type scale. Body: 14 and 16. Headings: h1 20, h2 24, h3 14 (small caps-style label), h4 16. Weights: 400 and 600. Line heights: 1.25 (names and headings), 1.45 (text), 1.8 (long inline lists). */
h1,h2,h3,h4{margin:0;font-weight:600;line-height:var(--lh-t)}
h1{font-size:var(--h1);margin-right:12px}h2{font-size:var(--h2)}h4{font-size:var(--text-m)}
h3{margin:14px 0 4px;font-size:var(--text-s);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
b,th,.nm,.ttl,.hatlink,.utotal,.fold summary,.seg button.on,.pct{font-weight:600}
a{color:var(--accent)}
/* shared pieces */
.dr,.drops-list{line-height:var(--lh-l)}
.muted,.sub,.src,.desc,.dr,.stats,.empty,.ttl,.urow .q,.used a,th{color:var(--mute);font-size:var(--text-s)}
.ctl,input,select,button,.ms summary{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--edge);border-radius:var(--r-m);padding:6px 10px}
button,.ms summary{cursor:pointer}
.ctl:hover,button:hover,.ms summary:hover,.on,.act,.sel{border-color:var(--accent)}
button.on{background:var(--accent-fill);color:var(--on-fill)}
.box{border:1px solid var(--line);border-radius:var(--r-l);background:var(--bg);padding:10px 12px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.lrow:first-child{border-top:0}
.lrow .n{flex:1;min-width:0}
.off{color:var(--mute)}.off img{opacity:.5}
.meter{height:6px;background:var(--chip);border-radius:var(--r);overflow:hidden;margin:6px 0 10px}.meter i{display:block;height:100%;width:0;background:var(--ok-fill);transition:width .2s}.meter.lg{height:14px;border-radius:var(--pill);margin:10px 0 0}.meter.lg i{border-radius:var(--pill)}
.progress{margin-bottom:12px}.progress-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.pct{font-size:var(--h2);line-height:1;font-variant-numeric:tabular-nums}
.meter.warn i{background:var(--warn-fill)}
/* chip: every label, tag, status and copy button */
.chip{display:inline-block;font:inherit;font-size:var(--text-s);padding:1px 10px;border-radius:var(--pill);background:var(--chip);color:var(--mute);border:1px solid transparent;white-space:nowrap;text-decoration:none}
.chip.ok{background:var(--ok-fill);color:var(--on-fill)}.chip.warn{background:var(--warn-fill);color:var(--on-fill)}.chip.accent{background:var(--accent-fill);color:var(--on-fill)}.chip.cool{background:var(--info-fill);color:var(--on-fill)}
.chip.outline{background:transparent;color:var(--ink);border-color:var(--warn)}
.chip.link{color:var(--ink);border-color:var(--edge);padding:4px 12px}.chip.link:hover{color:var(--accent);border-color:var(--accent)}
.chip.copy{font-family:ui-monospace,Menlo,monospace;padding:0 6px;border-radius:var(--r);border-color:var(--line);cursor:pointer}.chip.copy:hover{color:var(--ink);border-color:var(--accent)}.chip.copy.ok{border-color:var(--ok-fill)}
/* layout */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:160px}
.stats{margin-top:6px}
.layout{display:flex;align-items:flex-start}
main{padding:16px;flex:1;min-width:0}
aside{position:sticky;top:var(--hh,100px);width:max(600px,40vw);flex:none;height:calc(100vh - var(--hh,100px));overflow:auto;background:var(--card);border-left:1px solid var(--line)}
aside[hidden]{display:none}
aside:not([hidden]){animation:push .26s var(--ease)}aside.out{animation:push .2s var(--ease) reverse forwards}
.dlg.swap{animation:rise .24s var(--ease)}
@media (max-width:520px){.hero{flex-direction:column}.hero .art{width:100%}h1{width:100%}}
@media (max-width:1000px){aside:not([hidden]){animation:sheet .3s var(--ease)}aside.out{animation:sheet .2s var(--ease) reverse forwards}aside{position:fixed;inset:0;top:auto;height:80vh;width:100%;border:1px solid var(--line);border-radius:var(--r-l) var(--r-l) 0 0;z-index:10;box-shadow:var(--shadow)}}
.ms{position:relative}.ms summary{list-style:none;user-select:none}.ms summary::-webkit-details-marker{display:none}.ms summary::after{content:" ▾";color:var(--mute)}
.ms[open] .opts{animation:pop .16s var(--ease)}.ms .opts{position:absolute;z-index:8;top:100%;left:0;margin-top:4px;background:var(--card);border:1px solid var(--edge);border-radius:var(--r-m);padding:6px;min-width:180px;max-height:300px;overflow:auto;box-shadow:var(--shadow)}
.ms label{display:flex;gap:8px;align-items:center;padding:3px 6px;white-space:nowrap;cursor:pointer}
.quick:not([hidden]){animation:rise .2s var(--ease)}.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.qrow{display:flex;align-items:center;gap:8px}.quick input{width:72px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.card:hover,.card.sel{border-color:var(--accent)}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card:active{transform:none}.card.sel{box-shadow:0 0 0 1px var(--accent)}
.card.s-crafted,.card.s-owned{border-color:var(--ok-fill)}
.art{display:flex;align-items:center;justify-content:center;padding:16px;background:var(--chip);border-radius:var(--r-m)}
.card .art{height:132px}.art img{max-width:100%;object-fit:contain}.art img.fb{width:100%;height:100%;object-fit:contain}
.card .nm{line-height:var(--lh-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .nm img{width:24px;height:24px;vertical-align:middle}
.card>.chip{position:absolute;top:8px;right:8px}
/* panel */
.dlg{padding:0 20px 28px}
.pbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;min-height:52px;margin:0 -20px 12px;padding:8px 12px 8px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar a{font-size:var(--text-s)}
.xbtn{width:34px;height:34px;padding:0;border-radius:50%;font-size:var(--h2);line-height:1;display:grid;place-items:center;color:var(--mute);background:transparent;border-color:transparent;flex:none}
.xbtn:hover{background:var(--chip);color:var(--ink);border-color:var(--edge)}
.hero{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.hero .art{min-width:144px;min-height:144px;flex:none;border:1px solid var(--line);border-radius:var(--r-l)}
.hero .info{flex:1;min-width:0}.hero .idline{margin-top:4px}
.meta,.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.src{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.seg{display:flex;border:1px solid var(--edge);border-radius:var(--r-m);overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 4px;color:var(--mute)}
.seg button+button{border-left:1px solid var(--edge)}
.seg button:hover{color:var(--ink);background:var(--chip)}
.seg button.on{--fill:var(--accent-fill);background:var(--fill);color:var(--on-fill)}
.seg button.on[data-st=none]{--fill:var(--mute-fill)}.seg button.on[data-st=collecting]{--fill:var(--warn-fill)}.seg button.on[data-st=crafted],.seg button.on[data-st=owned]{--fill:var(--ok-fill)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 8px}
.sec h3{margin:0;}.sec .sub{font-variant-numeric:tabular-nums}
.uses{padding-block:4px}.utotal input{width:84px;text-align:right;font-weight:400}.urow .q{font-variant-numeric:tabular-nums}
.prow{margin-bottom:8px}.prow .top{display:flex;align-items:center;gap:12px}.prow .top>img{width:32px;height:32px;flex:none}
.prow .nm2{flex:1;min-width:0;line-height:var(--lh-t)}.prow input{width:84px;text-align:right}
.prow .dr{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.fold summary{cursor:pointer}.fold .desc{margin:8px 0 0}.desc{white-space:pre-line}
.hatlink{text-decoration:none}.hatlink:hover{text-decoration:underline}
.about p{margin:0 0 6px}.about h3{margin-top:18px}.about code{background:var(--chip);padding:1px 5px;border-radius:var(--r)}
/* materials table */
#mats table{width:100%;border-collapse:collapse}
#mats th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
#mats td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
#mats .num{text-align:right;font-variant-numeric:tabular-nums}
#mats input{width:68px}#mats img{width:24px;height:24px;vertical-align:middle;margin-right:6px}
.used a{text-decoration:none}.used a:hover{color:var(--accent);text-decoration:underline}
.empty{text-align:center;padding:40px}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Hat Tracker</h1>
    <input id="q" type="search" placeholder="Search hats, materials, NPC…">
    <details class="ms" id="fs"><summary>Status</summary><div class="opts"></div></details>
    <details class="ms" id="fn"><summary>Source</summary><div class="opts"></div></details>
    <button id="rdy" title="Only hats whose materials are all collected">Ready to craft</button>
    <button id="view" title="Switch between hat cards and the combined material list">Materials list</button>
    <button id="about">About</button>
    <button id="exp">Export</button><button id="imp">Import</button>
    <button id="th" title="Toggle theme">◐</button>
  </div>
  <div class="meter"><i id="prog"></i></div>
  <div class="stats"><span id="stats"></span> · <span id="sv"></span></div>
</header>
<div class="layout"><main><div class="quick" id="quick" hidden></div><div class="grid" id="grid"></div><div id="mats" hidden></div><div class="empty" id="empty" hidden>No hats match.</div>
<p class="sub" id="note"></p></main>
<aside id="panel" hidden><div class="dlg" id="dbody"></div></aside></div>
<input type="file" id="file" accept="application/json" hidden>
<script>
const STATUS={none:'Not started',collecting:'Collecting',crafted:'Crafted',owned:'Owned'};
const DONE=s=>s==='crafted'||s==='owned';
let HATS=[],state={};
const KEY='hat-tracker-v1';
const load=()=>{try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}migrate()};
function migrate(){if(state._inv)return;state._inv={};for(const o of Object.values(state))for(const[k,v]of Object.entries(o.have||{}))state._inv[k]=Math.max(state._inv[k]||0,v)}
let serverOK=false,pushT=null;
const note=t=>{const e=document.getElementById('sv');if(e)e.textContent=t};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}
  if(!serverOK)return;note('Saving…');clearTimeout(pushT);pushT=setTimeout(pushServer,300)};
async function pushServer(){try{const r=await fetch('api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});if(!r.ok)throw 0;note('Saved to progress.json')}catch{note('Could not save to progress.json')}}
// progress.json in the repo (served by scripts/serve.py) wins over the browser copy; without the server the browser copy is used
async function loadServer(){try{const r=await fetch('api/progress',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();serverOK=true;
  if(Object.keys(j).length){state=j;migrate();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}note('Saved to progress.json')}
  else if(Object.keys(state).length)pushServer();else note('Saves to progress.json')}catch{serverOK=false;note('Saved in this browser only (run scripts/serve.py to save to the repo)')}}
const st=h=>state[h.id]||(state[h.id]={status:'none',have:{}});
const status=h=>{const s=(state[h.id]||{}).status||'none';return s==='none'&&h.ingredients.some(g=>have(h,g)>0)?'collecting':s};  // holding any material counts as in progress
const have=(h,g)=>(state._inv||{})[g.id]||0;  // one shared count per material, not per hat
const progress=h=>{const g=h.ingredients;if(!g.length)return 0;return g.reduce((a,x)=>a+Math.min(have(h,x),x.qty)/x.qty,0)/g.length};
const ready=h=>h.ingredients.length&&h.ingredients.every(g=>have(h,g)>=g.qty);
let panelId=null;const F={fs:new Set(['none','collecting','crafted']),fn:new Set(),fl:new Set()},ST_ALL=['none','collecting','crafted','owned'];let onlyReady=false,view='grid';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=(src,alt='')=>src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.src='img/card.png'">`:'';
const chip=(id,kind)=>`<button type="button" class="chip copy" data-copy="${id}" title="Copy ${kind} ID">${id}</button>`;
// sprites are drawn at one shared zoom so hats keep their true size relative to each other (card 2x, panel 3x)
const art=(h,z)=>h.sprite&&h.size?`<img src="${esc(h.sprite)}" alt="${esc(h.name)}" style="width:${h.size[0]*z*(h.scale||1)}px;height:${h.size[1]*z*(h.scale||1)}px" onerror="this.src='img/card.png'">`:`<img class="fb" src="${esc(h.icon||'img/card.png')}" alt="${esc(h.name)}">`;
const naviCmd=l=>l?'/navi '+l.replace(/^\/navi\s+/,''):'';
const fmt=r=>r>=1?+r.toFixed(2)+'%':+r.toFixed(3)+'%';
const ORIGIN={uaro:'uaRO',classic:'Classic'};
const otag=h=>`<span class="chip ${h.origin==='classic'?'accent':'cool'}" title="${h.origin==='classic'?'An official iRO (classic) hat quest':'A uaRO-only hat quest'}">${ORIGIN[h.origin]}</span>`;
const label=h=>h.name+(h.slots?` [${h.slots}]`:'');

function filtered(){
  const q=$('q').value.toLowerCase();
  return HATS.filter(h=>{
    const s=status(h);
    if(!F.fs.has(s))return false;
    if(onlyReady&&!(ready(h)&&!DONE(s)))return false;
    if(F.fn.size&&!F.fn.has(h.origin))return false;
    if(q&&!(h.name+' '+(h.npc||'')+' '+ORIGIN[h.origin]+' '+h.ingredients.map(g=>g.name).join(' ')).toLowerCase().includes(q))return false;
    return true});
}
function msBuild(id,opts,label){
  const el=$(id);el.querySelector('.opts').innerHTML=opts.map(([v,t])=>`<label><input type="checkbox" value="${esc(v)}" ${F[id].has(v)?'checked':''}>${esc(t)}</label>`).join('');
  el.querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?F[id].add(i.value):F[id].delete(i.value);msLabel(id,label);render()});msLabel(id,label)}
function msLabel(id,label){const n=F[id].size,el=$(id);el.querySelector('summary').textContent=label+(n?` (${n})`:'');el.classList.toggle('act',n>0&&!(id==='fs'&&n===ST_ALL.length))}
function quick(){
  const q=$('q').value.trim().toLowerCase(),m={};
  if(q)HATS.forEach(h=>h.ingredients.forEach(g=>{if(g.name.toLowerCase().includes(q))m[g.id]=g}));
  const L=Object.values(m).slice(0,12);$('quick').hidden=!L.length;
  $('quick').innerHTML=L.map(g=>`<label class="ctl qrow">${img(g.icon,g.name)}<span>${esc(g.name)}</span>${chip(g.id,'item')}<input type="number" min="0" value="${have(null,g)||''}" placeholder="0" data-q="${g.id}" aria-label="Have ${esc(g.name)}"></label>`).join('');
  $('quick').querySelectorAll('input').forEach(i=>i.onchange=()=>{(state._inv||(state._inv={}))[i.dataset.q]=Math.max(0,+i.value||0);save();render();if(panelId!=null)openHat(panelId)});
}
function matRows(list){
  const m={};
  list.forEach(h=>h.ingredients.forEach(g=>{const o=m[g.id]||(m[g.id]={g,total:0,hats:[],open:0});o.total+=DONE(status(h))?0:g.qty;o.hats.push(h);if(!DONE(status(h)))o.open++}));
  return Object.values(m).map(o=>{const n=have(null,o.g),still=Math.max(0,o.total-n);
    o.have=n;o.still=still;o.st=o.open===0?'off':still===0?'ok':n>0?'part':'need';return o}).sort((a,b)=>{const r={need:0,part:0,ok:1,off:2};return r[a.st]-r[b.st]||b.still-a.still||a.g.name.localeCompare(b.g.name)});
}
const TAG={need:['Needed','warn'],part:['Partly have','outline'],ok:['Have enough','ok'],off:['Not needed','']};
function renderMats(list){
  const rows=matRows(list),need=rows.filter(r=>r.still>0);
  $('mats').innerHTML=`<div class="sub" style="margin-bottom:8px">${need.length} materials still needed · ${need.reduce((a,r)=>a+r.still,0).toLocaleString()} items in total, across the ${list.length} hats shown (hats marked Crafted or Owned don't count).</div>
  <table><thead><tr><th>Material</th><th class="num">Needed</th><th class="num">Have</th><th class="num">Still need</th><th>Status</th><th>Used by</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r.st==='off'?'off':''}"><td>${img(r.g.icon,r.g.name)}${esc(r.g.name)} ${chip(r.g.id,'item')}</td>
    <td class="num">${r.total.toLocaleString()}</td>
    <td class="num"><input type="number" min="0" value="${r.have||''}" placeholder="0" data-m="${r.g.id}" aria-label="Have ${esc(r.g.name)}"></td>
    <td class="num"><b>${r.still.toLocaleString()}</b></td>
    <td><span class="chip ${TAG[r.st][1]}">${TAG[r.st][0]}</span></td>
    <td class="used">${r.hats.map(h=>`<a href="#" data-hat="${h.id}">${esc(h.name)}</a>`).join(', ')}</td></tr>`).join('')}</tbody></table>`;
  $('mats').querySelectorAll('input[data-m]').forEach(i=>i.onchange=()=>{(state._inv||(state._inv={}))[i.dataset.m]=Math.max(0,+i.value||0);save();render();if(panelId!=null)openHat(panelId)});
  $('mats').querySelectorAll('[data-hat]').forEach(a=>a.onclick=e=>{e.preventDefault();navStack=[];openHat(+a.dataset.hat)});
}
function render(){
  $('rdy').classList.toggle('on',onlyReady);
  $('view').classList.toggle('on',view==='mats');$('view').textContent=view==='mats'?'Hat cards':'Materials list';
  document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');
  const list=filtered();
  $('grid').hidden=view==='mats';$('mats').hidden=view!=='mats';
  if(view==='mats')renderMats(list);
  $('grid').innerHTML=view==='mats'?'':list.map(h=>{const s=status(h),p=progress(h);
    return `<div class="card s-${s}${panelId==h.id?' sel':''}" data-id="${h.id}"><span class="chip ${{collecting:'warn',crafted:'ok',owned:'ok'}[s]||''}">${STATUS[s]}</span>
    <div class="art">${art(h,2)}</div>
    <div class="nm">${img(h.icon)} ${esc(label(h))}</div>
    <div class="sub">${[h.origin==='classic'?'Classic':h.npc,h.ingredients.length?`${h.ingredients.length} material${h.ingredients.length>1?'s':''}`:''].filter(Boolean).map(esc).join(' · ')}</div>
    ${h.ingredients.length&&!DONE(s)?`<div class="meter warn"><i style="width:${p*100}%"></i></div>`:''}</div>`}).join('');
  $('empty').hidden=list.length>0||view==='mats';
  const n=HATS.length,d=HATS.filter(h=>DONE(status(h))).length,c=HATS.filter(h=>status(h)==='collecting').length;
  $('prog').style.width=(n?d/n*100:0)+'%';
  $('stats').textContent=`${d} of ${n} hats done · ${c} in progress · ${HATS.filter(h=>ready(h)&&!DONE(status(h))).length} ready to craft · showing ${list.length}`;
}
let navStack=[];
const pbar=title=>`<div class="pbar">${navStack.length?`<a href="#" class="hatlink" id="back">← ${esc(label(HATS.find(x=>x.id==navStack[navStack.length-1])))}</a>`:''}<span class="ttl">${esc(title)}</span><button type="button" class="xbtn" id="close" title="Close (Esc)" aria-label="Close panel">×</button></div>`;
const dropsHtml=l=>l.map(d=>`${esc(d.mob)} ${chip(d.mob_id,'mob')} ${fmt(d.rate)}${d.mvp?' (MVP)':''}`).join(' · ');
function openHat(id,fromLink){
  if(fromLink&&panelId!=null&&panelId!=id)navStack.push(panelId);
  const h=HATS.find(x=>x.id==id),s=status(h),done=h.ingredients.filter(g=>have(h,g)>=g.qty).length;
  const mats=h.ingredients.map(g=>{const n=have(h,g),ok=n>=g.qty,off=DONE(s);
    const isHat=HATS.some(x=>x.id===g.id&&x.id!==h.id);
    return `<div class="box prow ${off?'off':''}"><div class="top">${img(g.icon,g.name)}
      <div class="nm2"><b class="${ok&&!off?'done':''}">${isHat?`<a href="#" class="hatlink" data-hat="${g.id}" title="Open this hat">${esc(g.name)} ↗</a>`:esc(g.name)}</b> ${chip(g.id,'item')}
        <div class="sub">× ${g.qty}${off||ok?'':` · need ${g.qty-n} more`} ${off?'<span class="chip">Not needed</span>':ok?'<span class="chip ok">Have enough</span>':''}</div></div>
      <input type="number" min="0" value="${n||''}" placeholder="0" data-g="${g.id}" aria-label="Have ${esc(g.name)}"></div>
      ${g.drops.length?`<div class="dr">Drops: ${dropsHtml(g.drops)}</div>`:''}</div>`}).join('');
  const pill=t=>`<span class="chip">${esc(t)}</span>`;
  // other hats that take this hat as a material: one copy for the collection plus the quantity each still-open hat needs
  const uses=HATS.filter(x=>x.id!==h.id).map(x=>({x,q:(x.ingredients.find(g=>g.id===h.id)||{}).qty})).filter(u=>u.q);
  const openUses=uses.filter(u=>!DONE(status(u.x))),forHats=openUses.reduce((a,u)=>a+u.q,0),spare=have(null,{id:h.id});
  const usesHtml=uses.length?`<div class="sec"><h3>Also used for</h3><span class="sub">You need ${1+forHats} in total</span></div>
    <div class="box uses"><div class="lrow urow"><span class="n">Your collection</span><span class="q">× 1</span>${DONE(s)?'<span class="chip ok">Have it</span>':'<span class="chip warn">Needed</span>'}</div>
    ${uses.map(u=>{const off=DONE(status(u.x));return `<div class="lrow urow ${off?'off':''}"><span class="n"><a href="#" class="hatlink" data-hat="${u.x.id}">${esc(label(u.x))} ↗</a></span><span class="q">× ${u.q}</span><span class="tag ${off?'':'need'}">${off?'Not needed':'Needed'}</span></div>`}).join('')}
    <div class="lrow utotal"><span>Spare copies for crafting (need ${forHats})</span><input type="number" min="0" value="${spare||''}" placeholder="0" data-g="${h.id}" aria-label="Spare copies of ${esc(h.name)}"></div></div>`:'';
  $('dbody').innerHTML=`${pbar(label(h))}
    <div class="hero"><div class="art">${art(h,3)}</div><div class="info">
      <h2>${esc(label(h))}</h2><div class="idline">${chip(h.id,'item')}</div>
      <div class="meta">${[otag(h),h.locations.length?pill(h.locations.join(' / ')):'',h.def!=null?pill('DEF '+h.def):'',h.level?pill('Lv '+h.level+'+'):''].join('')}</div>
      ${h.npc||h.location?`<div class="src">${h.npc?`<span>${esc(h.npc)}</span>`:''}${h.location?`<button type="button" class="chip copy" data-copy="${esc(naviCmd(h.location))}" title="Copy navigation command">${esc(naviCmd(h.location))}</button>`:''}</div>`:''}
${h.wiki||(h.rms||[]).length?`<div class="links">${h.wiki?`<a class="chip link" href="${esc(h.wiki)}" target="_blank" rel="noopener">Wiki ↗</a>`:''}${(h.rms||[]).map(r=>`<a class="chip link" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.title)} (RateMyServer, official iRO quest)">RMS quest ↗</a>`).join('')}</div>`:''}
    </div></div>
    <div class="seg" role="group" aria-label="Status">${Object.entries(STATUS).map(([k,v])=>`<button type="button" data-st="${k}" class="${k===s?'on':''}">${v}</button>`).join('')}</div>
    ${h.ingredients.length?`<div class="box progress"><div class="progress-top"><span class="pct">${Math.round(progress(h)*100)}%</span><span class="sub">${done} of ${h.ingredients.length} materials ready</span></div><div class="meter lg"><i style="width:${progress(h)*100}%"></i></div></div>`:''}
    ${usesHtml}
    <div class="sec"><h3>Materials</h3></div>
    ${mats||'<div class="sub">No materials recorded (drop or other source).</div>'}
    ${h.drops.length?`<div class="sec"><h3>Hat drops</h3></div><div class="sub drops-list">${dropsHtml(h.drops)}</div>`:''}
    ${h.desc.length?`<div class="sec"><h3>Details</h3></div><details class="box fold"><summary>Stats &amp; description</summary><div class="desc">${esc(h.desc.join('\n'))}</div></details>`:''}`;
  $('dbody').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{st(h).status=b.dataset.st;save();render();openHat(id)});
  $('dbody').querySelectorAll('input[data-g]').forEach(i=>i.onchange=()=>{
    const n=Math.max(0,+i.value||0);(state._inv||(state._inv={}))[i.dataset.g]=n;
    save();quick();render();openHat(id)});
  $('close').onclick=closePanel;
  $('dbody').querySelectorAll('[data-hat]').forEach(a=>a.onclick=e=>{e.preventDefault();openHat(+a.dataset.hat,true)});
  if($('back'))$('back').onclick=e=>{e.preventDefault();openHat(navStack.pop())};
  const keep=panelId==h.id?$('panel').scrollTop:0;if(panelId!=h.id)swap();panelId=h.id;clearTimeout(closeT);$('panel').classList.remove('out');$('panel').hidden=false;render();$('panel').scrollTop=keep;
}
function swap(){const d=$('dbody');d.classList.remove('swap');void d.offsetWidth;d.classList.add('swap')}  // fade the new hat in only when the panel changes, not on every keystroke
let closeT=null;
function closePanel(){navStack=[];panelId=null;render();const a=$('panel');if(a.hidden)return;a.classList.add('out');clearTimeout(closeT);closeT=setTimeout(()=>{a.hidden=true;a.classList.remove('out')},200)}
function about(){
  navStack=[];
  $('dbody').innerHTML=`${pbar('About')}
  <div class="about">
  <p>Hat Tracker follows the headgear you are collecting or crafting on uaRO: what each hat needs, what you already hold and where the materials drop. Progress saves to <code>progress.json</code> in the repo as you type (and in your browser as a backup).</p>
  <h3>Statuses</h3>
  <p><b>Not started</b>, <b>Collecting</b>, <b>Crafted</b> and <b>Owned</b>. Crafted and Owned count as done. A hat shows as Collecting on its own when you hold any of its materials.</p>
  <h3>Materials</h3>
  <p>Material counts are shared: the number you hold of an item is the same in every hat that uses it. When a hat is done, its materials stop counting as needed. If a hat is also a material of another hat, its panel shows how many copies you need in total.</p>
  <h3>uaRO and Classic</h3>
  <p><b>Classic</b> hats come from an official iRO quest, so they link to the RateMyServer quest page and use its NPC and <code>/navi</code> location. <b>uaRO</b> hats come from uaRO-only quests (for example the Dimonka headgear quest) and use the uaRO wiki for their NPC and location.</p>
  <h3>Drops</h3>
  <p>Drop sources are pre-renewal and only from monsters that spawn naturally. Rates show uaRO's x5 (x3 for MVPs), capped at 100%.</p>
  <h3>Data</h3>
  <p>Item data is official iRO (rathena), so values may differ on uaRO. Sprites come from the iRO client and are cleaned so transparent areas are not filled in wrongly. Quest data comes from the uaRO loot sheet, the uaRO wiki and RateMyServer, all collected by game-data-tools.</p>
  </div>`;
  $("close").onclick=closePanel;swap();panelId=null;clearTimeout(closeT);$("panel").classList.remove('out');$("panel").hidden=false;render();$('panel').scrollTop=0;
}
async function init(){
  load();await loadServer();
  const t=(()=>{try{return localStorage.getItem('hat-theme')}catch{}})();if(t)document.documentElement.dataset.theme=t;
  const d=await (await fetch('hats.json',{cache:'no-cache'})).json();HATS=d.hats;$('note').textContent=d.note;
  msBuild('fs',Object.entries(STATUS),'Status');
  msBuild('fn',Object.entries(ORIGIN),'Source');
  $('q').addEventListener('input',()=>{quick();render()});
  document.addEventListener('click',async e=>{const b=e.target.closest('.copy');if(!b)return;e.preventDefault();e.stopPropagation();
    const v=b.dataset.copy;try{await navigator.clipboard.writeText(v)}catch{const t=document.createElement('textarea');t.value=v;document.body.append(t);t.select();try{document.execCommand('copy')}catch{}t.remove()}
    const o=b.textContent;b.textContent='copied';b.classList.add('ok');setTimeout(()=>{b.textContent=o;b.classList.remove('ok')},900)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('panel').hidden&&!e.target.closest?.('.ms'))closePanel()});
  $('view').onclick=()=>{view=view==='mats'?'grid':'mats';render()};
  $('rdy').onclick=()=>{onlyReady=!onlyReady;render()};
  document.addEventListener('click',e=>{document.querySelectorAll('.ms[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});
  $('grid').onclick=e=>{const c=e.target.closest('.card');if(c){navStack=[];openHat(c.dataset.id)}};
  $('about').onclick=about;
  $('th').onclick=()=>{const r=document.documentElement,n=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('hat-theme',n)}catch{}};
  $('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));a.download='hat-tracker-progress.json';a.click()};
  $('imp').onclick=()=>$('file').click();
  $('file').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(typeof j!=='object'||Array.isArray(j))throw 0;state=j;migrate();save();render()}catch{alert('Not a valid progress file.')}e.target.value=''};
  render();
}
init();
</script>
</body>
